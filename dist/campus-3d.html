<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Quest · 英语冒险</title><link rel="stylesheet" href="campus-3d.css?v=1"><body>
<header><a href="./">← 冒险大厅</a><b>Campus Quest / 第 1 关</b><button id="settings">音色 · 语速</button></header>
<main id="stage"><div id="labels"></div><aside id="npc-note" hidden aria-label="人物任务文本"><div class="note-head"><b id="note-name"></b><button id="note-close" aria-label="关闭人物文本">×</button></div><p id="note-en" lang="en"></p><details><summary>中文辅助</summary><p id="note-zh"></p></details><div class="controls"><button id="note-replay">🔊 重听</button><button id="note-slow">慢速</button></div></aside><div class="scene-title"><small>第 1 关</small><h1>未来校园 · 科技展准备</h1><p>你来行动，Nova 陪你分析</p></div><div id="status" role="status">先准备，再出发</div></main>
<section id="dock"><div><b id="person">欢迎来到校园科技展</b><span id="phase"></span></div><p id="hint">点击地面行走 · WASD / 方向键移动 · 走近人物点 ? 或按 E</p><div class="controls"><button id="talk" disabled>🎙 开口交流</button><button id="cancel-voice" hidden>取消录音</button><button id="replay" disabled>🔊 重听</button><button id="slow" disabled>慢速</button><button id="coach" disabled>问 Nova</button><button id="pickup" hidden>领取设备</button><button id="deliver" hidden>交给 Mia</button></div><details><summary>需要文字帮助</summary><p id="line"></p><p id="zh"></p><p id="raw"></p><form id="typing"><input aria-label="用英语交流" maxlength="300" placeholder="用英语交流"><button>发送</button></form><audio id="recording" controls hidden></audio></details></section>
<dialog id="welcome" open><small>科技展准备</small><h2>先准备你的语言背包</h2><p>听一听这些表达，再走进校园。任务中的具体需求要亲自听取。</p><div id="words"></div><label>英语音色<select id="voice"></select></label><label>语速<select id="rate"><option value=".65">0.65× 很慢</option><option value=".75">0.75× 慢速</option><option value=".85" selected>0.85× 舒缓</option><option value="1">1× 正常</option></select></label><button id="sample">试听</button><p id="audio-status" role="status"></p><button id="begin">准备好了，进入校园</button><button id="text-begin">文字体验</button></dialog>
<dialog id="win"><div class="stars">★★★</div><h2>委托完成！</h2><p>你找回了设备，科技展正式启动！</p><button id="thanks">🔊 听感谢</button><button id="restart">再玩一次</button><a href="./">返回大厅</a></dialog>
<script type="module" src="campus-3d.js?v=1"></script></body></html>
