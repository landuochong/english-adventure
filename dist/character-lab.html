<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教练动作验收台</title><style>
*{box-sizing:border-box}body{margin:0;background:#dae3e7;color:#173645;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}header{position:fixed;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:22px;margin:0 0 6px}p{margin:0;color:#546f7b}a,button,select{font:inherit;color:#173645;background:#f5f9fa;border:1px solid #9fb5bf;border-radius:7px;padding:9px 12px;pointer-events:auto;text-decoration:none}button{cursor:pointer}#panel{position:fixed;right:24px;top:100px;width:250px;padding:15px;background:#f5faf1ed;border:1px solid #bdc9cb;border-radius:12px}label{display:block;margin-bottom:12px}select{width:100%;margin-top:4px}#metrics{white-space:pre-wrap;font:12px/1.8 ui-monospace,monospace}#result{font-size:12px;line-height:1.6;margin-top:12px}nav{position:fixed;left:24px;bottom:24px;display:flex;gap:8px;flex-wrap:wrap}#status{position:fixed;left:24px;top:90px;background:#fff9;padding:10px}@media(max-width:700px){#panel{width:185px;right:12px;font-size:12px}header{left:12px;right:12px}h1{font-size:18px}nav{left:12px;max-width:95%}}
</style><body><header><div><h1>教练动作验收台</h1><p>同一模型 · 分离素材与移动控制 · 拖动环顾</p></div><a href="campus-environment.html">返回校园</a></header><div id="status" role="status">正在加载教练…</div><section id="panel"><label>动作<select id="clip"><option value="Idle_Standing">自然站立</option><option value="Walk_Relaxed">放松行走</option><option value="Walk_Brisk" selected>快步行走（校园当前）</option><option value="Jog">慢跑</option></select></label><label>运动方式<select id="motion"><option value="stationary">原地观察步态</option><option value="straight">直线往返</option><option value="circle">连续转弯</option><option value="stop">走路 → 停下 → 起步</option></select></label><label>播放速度<select id="rate"><option value="1">正常</option><option value="0.25">¼ 慢动作</option></select></label><pre id="metrics"></pre><button id="scan" disabled>扫描一个动作周期</button><div id="result" role="status">脚部数据来自鞋子蒙皮顶点，不以关节高度代替脚底。</div></section><nav><button id="pause">暂停</button><button id="step">前进一帧</button><button data-view="front">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button></nav><script type="module" src="character-lab.js"></script></body></html>
