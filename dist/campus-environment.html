<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="campus-environment-game.css?v=click-pickup-1"><title>Campus Quest · 校园场景</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#a4c4d6;font-family:system-ui;color:#fff}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 8px #0009}header{display:flex;justify-content:space-between;padding:25px 30px}header span{font-size:13px;opacity:.85}h1{font-size:21px;font-weight:500;letter-spacing:.06em;margin:0 0 6px}#reticle{position:absolute;left:50%;top:50%;width:4px;height:4px;border:1px solid white;border-radius:50%}footer{position:absolute;bottom:24px;left:30px;font-size:12px;line-height:1.8}button,a{font:inherit;color:inherit}#home{pointer-events:auto;text-decoration:none;border:1px solid #fff6;border-radius:4px;padding:7px 14px;background:#16314244}#entry{position:fixed;inset:0;display:grid;place-content:center;background:#0b233b65;text-align:center;backdrop-filter:blur(3px)}#entry[hidden]{display:none}#entry h2{font-size:40px;margin:0 0 14px;font-weight:500}#entry p{font-size:15px;line-height:1.8;color:#e0ecf3}button{cursor:pointer;background:#eff6f9;color:#16344b;border:0;border-radius:4px;padding:14px 24px}#mobile{position:fixed;bottom:25px;right:25px;display:grid;grid-template-columns:repeat(3,42px);gap:6px}#mobile button{padding:8px;background:#17385480;color:white;border:1px solid #fff6;touch-action:none}#error{position:fixed;top:30%;left:10%;right:10%;background:#fff;color:#15334b;padding:20px;display:none}@media(max-width:650px){header{padding:18px}h1{font-size:17px}footer{left:18px;max-width:50%}#entry h2{font-size:28px}}

#minimap{position:fixed;top:94px;right:30px;width:220px;background:#102d3ee8;border:1px solid #c4e0e94d;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px #09233333;backdrop-filter:blur(12px)}
#map-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 14px;background:transparent;color:#e7f4f6;font-size:13px;text-align:left}#map-toggle:focus-visible{outline:2px solid #ffc56d;outline-offset:-3px}#map-toggle span{color:#b4cbd3;font-size:12px}#map-body{padding:0 10px 10px}#map-body[hidden]{display:none}#minimap svg{display:block;width:100%;height:auto;background:#203d4b;border-radius:7px}#minimap p{margin:8px 2px 0;font-size:11px;color:#b9d0d9;display:flex;justify-content:space-between}#minimap .you{color:#ffd18b}#minimap.collapsed{width:130px}@media(max-width:650px){#minimap{top:86px;right:18px;width:160px}#map-toggle{padding:9px 11px}#minimap p{font-size:10px}}
</style><body><div id="hud"><header><div><h1>未来校园 · 自由探索</h1><span>科学中心 · 咖啡馆 · 商店 · 图书馆</span></div><a id="home" href="./">关卡地图</a></header><div id="reticle"></div><footer>WASD / 方向键行走 · 点击地面移动 · 固定 2.5D 视角 · 走近点击人物交谈<br>Shift 快走 · Esc 暂停</footer></div><div id="mobile"><span></span><button data-dir="w">↑</button><span></span><button data-dir="a">←</button><button data-dir="s">↓</button><button data-dir="d">→</button></div><aside id="minimap" aria-label="校园小地图"><button id="map-toggle" aria-expanded="true" aria-controls="map-body">小地图 <span>收起 −</span></button><div id="map-body"><svg id="map-svg" viewBox="-50 -46 130 120" role="img" aria-label="校园建筑、入口及你的实时位置，地图上方为北"><g id="map-layout"></g><g id="map-player"><path d="M0 -10 L-6 -1 Q0 -3 6 -1Z" fill="#ffd18b" opacity=".18"/><path d="M0 -3.6 L-2.5 2.6 L0 1.3 L2.5 2.6Z" fill="#ffd18b" stroke="#172e3c" stroke-width=".7"/></g><text x="42" y="-38" fill="#bad1d9" font-size="4" text-anchor="middle">N ↑</text></svg><p><span class="you">▲ 你的位置</span><span>青色 · 入口</span></p></div></aside><div id="entry"><h2>走进未来校园</h2><p>在校园各处，完成你的英语故事<br>和 Jalor 一起探索，选择你的故事</p><button id="start">继续探索</button></div><div id="error"></div><script src="reference/robots-runtime.js"></script><script type="module" src="campus-environment.js?v=invite-finish-1"></script></body></html>
