<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原声录音与识别对比</title><style>body{font:17px/1.7 system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f5f6f2;color:#18392c}button,a{margin:8px 8px 8px 0}button{padding:12px 20px;border:0;border-radius:12px;background:#245840;color:white;font:inherit}button:disabled{opacity:.4}section{background:white;padding:22px;border-radius:18px;margin-top:20px}audio{width:100%}#status{font-weight:bold}pre{white-space:pre-wrap}label{display:block}input{width:95%;padding:10px;font:inherit}</style><p>当前识别：Whisper small · 固定英语</p><label>场景提示<select id="scene"><option value="directions">公交问路</option><option value="">无场景提示</option><option value="school">校园借书</option><option value="restaurant">咖啡馆点餐</option><option value="shopping">购物</option><option value="weather">天气</option><option value="hobbies">运动</option></select></label><h1>录下原声，再看识别结果</h1><p>点击开始后说一句英语，再点击停止。可以先听原声；只有点击“保存并识别”才保存到本机，不上传云端、不进入 Git。</p><p>建议分别录：Bus five. / Please take bus five. / Which bus goes to the museum?</p><label>你准备说的内容（仅供对照，不传给识别模型）<input id="expected" value="Please take bus five."></label><button id="start">开始录音</button><button id="stop" disabled>停止录音</button><p id="status" role="status">尚未录音 · 每段最多 30 秒</p><section><h2>本次原声</h2><audio id="audio" controls></audio><button id="save" disabled>保存并识别</button><a id="download" hidden>下载原声 WAV</a><pre id="result"></pre></section><p><a href="/">返回游戏</a></p><script type="module" src="voice-lab.js?v=2"></script></html>
