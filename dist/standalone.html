function transition(s,action,value){
 const n={...s,clues:[...s.clues]};
 if(action==='enter')n.entered=true;
 if(action==='prepare'){n.prepared=true;n.entered=true;}
 if(action==='move'&&['plaza','library','art','greenhouse','gym'].includes(value))n.location=value;
 if(action==='mode')n.mode=value==='voice'?'voice':'companion';
 if(action==='start'&&n.prepared&&n.location==='plaza')n.started=true;
 if(action==='clue'&&n.started&&((value==='witness'&&n.location==='library')||(['record','decoration'].includes(value)&&n.location==='art'))&&!n.clues.includes(value))n.clues.push(value);
 if(action==='discover'&&n.started&&n.clues.length===3&&n.location==='greenhouse'){n.discovered=true;}
 if(action==='complete'&&n.discovered&&!n.complete)n.complete=true;
 if(action==='wake'&&n.discovered&&n.location==='greenhouse'&&n.clues.length===3)n.awake=true;
 if(action==='follow'&&n.location==='greenhouse'&&n.awake)n.following=true;
 if(action==='finish'&&n.location==='plaza'&&n.following)n.complete=true;
 if(action==='practice')n.practice++;
 return n;
}
function restore(raw){try {const s=JSON.parse(raw);if(s?.version!==1||!['plaza','library','art','greenhouse','gym'].includes(s.location)||!Array.isArray(s.clues))return initial();const n=initial();for(const key of ['entered','prepared','started','awake','following','complete'])n[key]=s[key]===true;if(n.prepared)n.entered=true;n.location=s.location;n.mode=s.mode==='voice'?'voice':'companion';n.clues=[...new Set(s.clues.filter(x=>['witness','record','decoration'].includes(x)))];n.practice=Number.isInteger(s.practice)&&s.practice>=0?s.practice:0;if(!n.started)n.clues=[];n.discovered=(s.discovered===true||s.awake===true)&&n.started&&n.clues.length===3;n.awake=n.awake&&n.discovered;n.following=n.following&&n.awake;n.complete=n.discovered&&(s.complete===true||s.complete!==false);return n;}catch{return initial();}}

const storyIds = Object.keys(stories);
const storyList = storyIds.map(id => ({ id, topic: stories[id].topic, name: stories[id].name }));

// 与 discussClue 风格一致：处理“检查题 / 问词义 / 请再说一遍 / 答对了 / 答错”等分支。
// checking=true 时，用 answer 正则判定用户是否答对（排除否定词）。
function discussStory(id, text, checking = false) {
  const d = stories[id];
  if (!d) return { en: 'No story here yet.', zh: '这里还没有故事。', checking: false };
  const t = text.toLowerCase();

  if (checking && !/意思|解释|听不懂|mean|explain|understand|why/.test(t)) {
    const negated = /\b(no|not|never|didn't|didn’t)\b|不是|没有|没/.test(t);
    const matches = d.answer.test(t) && !negated;
    const pair = matches ? d.feedback : (d.wrong || [d.simple[0] + ' ' + d.check[0], d.simple[1] + ' ' + d.check[1]]);
    return { en: pair[0], zh: pair[1], checking: !matches };
  }

  if (/检查|复述|check|test|quiz/.test(t)) return { en: d.check[0], zh: d.check[1], checking: true };

  const term = d.terms && Object.keys(d.terms).find(w => t.includes(w));
  if (term) return { en: d.terms[term][0], zh: d.terms[term][1], checking: false };

  if (/为什么|why/.test(t)) return {
    en: 'This story shows one small moment in daily life. What did you hear about the people?',
    zh: '这个故事展示了日常生活中的一个小片段。你从人物身上听到了什么？'
  };

  if (/词|意思|mean|word|vocab/.test(t)) return { en: d.words[0], zh: d.words[1], checking: false };

  if (/听不懂|不明白|讨论|解释|换|简单|detail|explain|understand|simpl|rephrase|said|say/.test(t))
    return { en: d.simple[0], zh: d.simple[1], checking: false };

  return {
    en: 'Stay with ' + d.name + '’s story. Ask about a word, ask me to say it again, or try the check question.',
    zh: '我们继续看 ' + d.name + ' 的故事。可以问词义、请我再说一遍，或回答问题。',
    checking: false
  };
}

function englishVoices(voices) {
  return voices.filter(v => /^en(?:[-_]|$)/i.test(v.lang));
}
const voiceKey = v => JSON.stringify({name:v.name,lang:v.lang.toLowerCase().replace('_','-')});
function chooseVoice(voices, preferred = '') {
  const english=englishVoices(voices);
  // Empty means Google US English, not an unspecified system voice.
  if(!preferred)return english.find(v=>/google/i.test(v.name)&&/^en[-_]US$/i.test(v.lang))||null;
  // Stable identity survives voiceURI changes. Keep old saved URI selections compatible.
  return english.find(v=>voiceKey(v)===preferred||v.voiceURI===preferred)||null;
}
function loadVoices(synth, timeout = 2500, ready = voices => voices.length > 0) {
  if(ready(synth.getVoices()))return Promise.resolve(synth.getVoices());
  return new Promise(resolve=>{
    let timer,poll;
    const finish=()=>{clearTimeout(timer);clearInterval(poll);synth.removeEventListener('voiceschanged',changed);resolve(synth.getVoices());};
    const changed=()=>{if(ready(synth.getVoices()))finish();};
    synth.addEventListener('voiceschanged',changed);
    timer=setTimeout(finish,timeout);poll=setInterval(changed,100);changed();
  });
}

const normalise=text=>String(text).toLowerCase().replace(/[’]/g,"'").replace(/\b(where|what|who|how)'s\b/g,'$1 is').replace(/'/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
function mentionsTask(text){return /\b(pip|robots?)\b/.test(normalise(text));}
function assessQuestion(person,text,{topicEstablished=false}={}){
 const t=normalise(text),explicit=mentionsTask(text);
 const response=(kind,en,zh)=>({kind,en,zh});
 if(!t||/[\u3400-\u9fff]/.test(text))return response('clarify','Could you try asking in English? Nova can help you.','试着用英语提问，Nova 可以帮你组织表达。');
 if(/^(hi|hello|hey|good morning|good afternoon|good evening)( there)?$/.test(t))return response('greeting','Hello! What would you like to ask me?','你好！你想问我什么？');
 if(/^(thanks|thank you|thank you very much|thanks a lot|bye|goodbye)$/.test(t))return response('social','You’re welcome. Let me know if you have a question.','不用谢，有问题可以再问我。');
 const question=t.replace(/^(?:hi|hello|hey|excuse me|please)\s+/,'');
 const asks=/^(?:where|whereabouts|what|which|why|how)\b/.test(question)||/\b(?:have|has|did|do|does|can|could|would|will)\s+(?:you|i|we|they|he|she|it|anyone|anybody|someone|somebody)\b.*\b(?:see|seen|saw|know|find|locate|go|went|gone|happen|happened|help|tell|show|explain|mean|means|flash|flashing|carry|carried|take|took|move|moved|record|records)\b|\b(?:tell|show|explain|describe)\b.*\b(?:me|us|please)\b|^you (?:seen|see|know)\b|^(?:location|whereabouts) please\b/.test(t);
 const reference=explicit||(topicEstablished&&/\b(it|him|its)\b/.test(t));
 const appearance=reference&&/\b(?:what colou?r|what does .* look like|describe)\b/.test(t);
 if(appearance)return response('appearance','Pip is a small white robot with a blue light. What else would you like to know?','Pip 是带蓝灯的小白色机器人。你还想了解什么？');
 const offTopic=/\b(?:your name|how are you|weather|football|basketball|favo[u]?rite|pizza|birthday|age|joke)\b/.test(t);
 const observation=/\b(?:seen|see|saw|know|find|locate|looking|missing|go|went|gone|happen|happened|where|whereabouts|location)\b/.test(t);
 const requestForHelp=/\b(?:looking for|trying to find)\b.*\b(?:pip|robot)\b.*\b(?:can|could|would|will)\b.*\bhelp\b/.test(t);
 const roleTopic=person.id==='artist'?/\b(?:decoration|decorations|shiny object)\b/.test(t):person.id==='technician'?/\b(?:records?|blue light|flash|flashing)\b/.test(t):false;
 if(!offTopic&&((reference&&asks&&observation)||requestForHelp||(roleTopic&&asks)))return {kind:'relevant'};
 if(explicit&&!asks&&!offTopic)return response('clarify','What would you like to know about the missing robot?','你想了解这个失踪机器人的什么信息？');
 if(asks&&!reference&&!roleTopic&&!offTopic)return response('clarify','Who or what are you asking about?','你问的是谁，或什么东西？');
 return response('off-topic','I can help with the missing robot. What would you like to ask?','我可以提供与失踪机器人有关的信息，你想问什么？');
}

function discussClue(s,id,text,checking=false){
 const d=discussions[id];
 if(!d||!s.started||(d.clue&&!s.clues.includes(d.clue)))return {en:'First, listen to a person. Then we can discuss what they said together.',zh:'先听一位人物说话，再一起讨论他提供的信息。',checking:false};
 const t=text.toLowerCase();let pair;
 if(checking&&!/意思|解释|听不懂|mean|explain|understand|why/.test(t)){const matches=d.answer.test(t)&&!(/\b(no|not|never|didn't|didn’t)\b|不是|没有|没经过/.test(t));pair=matches?d.feedback:['Let’s listen to that part again. '+d.simple[0]+' '+d.check[0],'我们再听听这一部分。'+d.simple[1]+' '+d.check[1]];return {en:pair[0],zh:pair[1],checking:!matches};}
 if(/检查|复述|check|test|quiz/.test(t))return{en:d.check[0],zh:d.check[1],checking:true};
 const terms={towards:['Towards means moving in a direction. It does not mean arriving there.','towards 是朝某个方向移动，不代表已经到达。'],past:['Went past means passed a place without stopping there.','went past 是经过某地，没有停在那里。'],flashing:['Flashing means the light turns on and off again and again.','flashing 表示灯反复一亮一灭。'],shiny:['Shiny means something reflects light, like a mirror.','shiny 表示反光、闪亮，比如镜子。'],followed:['Followed means went after someone or something.','followed 表示跟着某个人或物体走。']};
 const allowed={librarian:['towards','past'],artist:['shiny','followed'],technician:['flashing'],organiser:[]};
 const term=allowed[id].find(w=>t.includes(w));
 if(term)pair=terms[term];
 else if(/为什么|why/.test(t))pair=id==='technician'?d.simple:id==='artist'?['Amy said Pip followed her. She did not explain why. What else have you heard?','Amy 说 Pip 跟着她，但没有解释原因。你还听到过什么？']:['This person told us what they noticed. It is one clue, not the whole story.','这个人物告诉我们他观察到的事情，这只是一条线索，不是完整的故事。'];
 else if(/词|意思|mean|word|vocab/.test(t))pair=d.words;
 else if(/听不懂|不明白|讨论|解释|换|简单|detail|explain|understand|simpl|rephrase|said|say|direction|方向/.test(t))pair=d.simple;
 else pair=['Let’s stay with '+d.name+'’s clue. Ask about a word, ask me to say it another way, or try a check question.','我们继续讨论 '+d.name+' 的线索。可以问词义、请我换个说法，或者检查你的理解。'];
 return {en:pair[0],zh:pair[1],checking:false};
}

// A recognition result is a revision of the current session, never a new utterance.
class TranscriptBuffer {
 constructor(){this.completed=[];this.current=[];}
 update(results){this.current=Array.from(results,r=>({text:(r[0]?.transcript||'').trim(),final:r.isFinal===true}));}
 commit(){this.completed.push(...this.current);this.current=[];}
 snapshot(){const all=[...this.completed,...this.current].filter(r=>r.text);return {text:all.map(r=>r.text).join(' '),needsReview:all.some(r=>!r.final)};}
}
class SilenceGate {
 constructor({silenceMs=2000,threshold=.35}={}){this.silenceMs=silenceMs;this.threshold=threshold;this.heard=false;this.lastSpeech=null;this.lastFrame=null;}
 speechStart(now){this.heard=true;this.lastSpeech=now;}
 frame(probability,now){this.lastFrame=now;if(probability>=this.threshold)this.lastSpeech=now;}
 state(now){const elapsed=this.lastSpeech===null?0:Math.max(0,now-this.lastSpeech);return {heard:this.heard,remaining:this.heard?Math.max(0,this.silenceMs-elapsed):this.silenceMs,ended:this.heard&&elapsed>=this.silenceMs,stale:this.lastFrame!==null&&now-this.lastFrame>1000};}
}

// Browser adapters are injected, so pause/restart/late-result races can be tested.
function createVoiceTurn({Recognition,createVAD,onUpdate=()=>{},onComplete=()=>{},onError=()=>{},silenceMs=2000,clock={now:()=>performance.now(),setTimeout:(fn,ms)=>globalThis.setTimeout(fn,ms),clearTimeout:id=>globalThis.clearTimeout(id),setInterval:(fn,ms)=>globalThis.setInterval(fn,ms),clearInterval:id=>globalThis.clearInterval(id)}}){

 const active=()=>!closed&&phase!=='finalizing';
 const emit=()=>{const state=gate.state(clock.now());onUpdate({...buffer.snapshot(),phase,remaining:state.remaining});};
 function clearTimers(){for(const id of [restart,drain,startTimer])if(id!==null)clock.clearTimeout(id);if(poll!==null)clock.clearInterval(poll);}
 function releaseVAD(){const current=vad;vad=null;if(current)releasePromise=Promise.resolve().then(()=>current.destroy()).catch(()=>{});return releasePromise;}
 function finish(){if(closed||settled)return;settled=true;closed=true;clearTimers();buffer.commit();recognizer?.abort();recognizer=null;const result=buffer.snapshot();void releaseVAD().then(()=>{onComplete(result);});}
 function fail(code){if(closed)return;closed=true;clearTimers();recognizer?.abort();recognizer=null;void releaseVAD().then(()=>onError(code,buffer.snapshot().text));}
 function beginRecognition(){
  if(!active())return;
  const r=new Recognition();recognizer=r;recognitionRunning=true;
  r.lang='en-US';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  startTimer=clock.setTimeout(()=>{if(recognizer===r)fail('recognition-timeout');},8000);
  r.onstart=()=>{if(closed||recognizer!==r)return;clock.clearTimeout(startTimer);if(!initialised)gate.frame(0,clock.now());initialised=true;startedAt=startedAt??clock.now();phase='listening';emit();};

  r.onerror=e=>{if(closed||recognizer!==r)return;if(e.error==='no-speech')return;if(e.error==='aborted'&&phase==='finalizing')return;fail(e.error||'recognition-error');};

 function abort(){if(closed)return;closed=true;clearTimers();recognizer?.abort();recognizer=null;void releaseVAD();}
 async function start(){
  emit();
  try{
   const loaded=await createVAD({onFrameProcessed:p=>{if(active()&&initialised)gate.frame(p.isSpeech,clock.now());},onSpeechRealStart:()=>{if(active()&&initialised){gate.speechStart(clock.now());phase='speaking';emit();}}});

   beginRecognition();
   poll=clock.setInterval(()=>{
    if(!active()||!initialised)return;const now=clock.now(),g=gate.state(now);
    // A suspended audio pipeline is not three seconds of observed silence.
    if(g.stale){fail('vad-stalled');return;}
    if(g.ended){stop();return;}
    if(!g.heard&&now-startedAt>=15000){fail('no-speech');return;}
    phase=g.heard?(g.remaining<2700?'waiting':'speaking'):'listening';emit();
   },100);
  }catch(error){fail(error.name==='NotAllowedError'?'not-allowed':'vad-unavailable');}
 }
 return {start,stop,abort};
}

let loading;
const base=new URL('./vendor/vad/',import.meta.url);
function script(file){return new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src=new URL(file,base).href;tag.onload=resolve;tag.onerror=()=>{tag.remove();reject(new Error('VAD asset loading failed'));};document.head.append(tag);});}
async function load(){if(!loading)loading=(async()=>{if(!window.ort)await script('ort.wasm.min.js');if(!window.vad)await script('bundle.min.js');window.ort.env.wasm.numThreads=1;window.ort.env.wasm.proxy=false;})().catch(error=>{loading=null;throw error;});return loading;}
export async function createBrowserVAD(callbacks,{getStream}={}){
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(!Audio||!navigator.mediaDevices?.getUserMedia)throw new Error('Microphone/VAD not supported');
 const context=new Audio(),streams=new Set();let destroyed=false;
 const acquire=async()=>{const stream=await(getStream?getStream(context):navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,autoGainControl:true,noiseSuppression:true}}));if(destroyed){stream.getTracks().forEach(t=>t.stop());throw new DOMException('Capture cancelled','AbortError');}streams.add(stream);return stream;};
 try{
  await context.resume();await load();
  const mic=await window.vad.MicVAD.new({model:'v5',startOnLoad:false,audioContext:context,baseAssetPath:base.href,onnxWASMBasePath:base.href,positiveSpeechThreshold:.5,negativeSpeechThreshold:.35,minSpeechMs:160,redemptionMs:3000,submitUserSpeechOnPause:false,getStream:acquire,...callbacks});
  return {start:()=>mic.start(),destroy:async()=>{if(destroyed)return;destroyed=true;streams.forEach(stream=>stream.getTracks().forEach(t=>t.stop()));try{await mic.destroy();}finally{if(context.state!=='closed')await context.close();}}};
 }catch(error){if(context.state!=='closed')await context.close();throw error;}
}

if(['map','prep','notebook','review','stories'].includes(a)){if(a==='stories'){keys.clear();destination=null;cancelVoice();stopSpeech();micError='';activeStory=null;storyStep=0;storyChecking=false;storyResult=null;view='welcome';render();return;}if(!navEnabled(a)){commit('enter');view='prep';const g=guidance(s);say(g.en,g.zh);speak(g.en);return;}keys.clear();destination=null;cancelVoice();stopSpeech();micError='';activeStory=null;storyStep=0;storyChecking=false;storyResult=null;view=a;render();return;}if(a==='welcome-home'){cancelVoice();stopSpeech();micError='';activeStory=null;storyStep=0;storyChecking=false;storyResult=null;view='welcome';render();return;}if(a==='story-select'){storySelect(v);return;}if(a==='story-back'){storyBack();return;}if(a==='story-step'){storyStep=Number(v);render();return;}if(a==='story-listen'){if(storyResult&&storyResult.en)speak(storyResult.en);else if(activeStory)speak(stories[activeStory].simple[0]);return;}if(a==='story-slow'){if(activeStory)speak(stories[activeStory].simple[0],true);return;}if(a==='story-mic'){mic('story');return;}if(a==='move'){const n=NPCS.find(n=>n.location===v);if(n)targetNpc(n.id);return;}if(a==='mode'){commit('mode',v);render();return;}if(a==='begin'){if(!navEnabled('prep'))return;commit('prepare');view='map';guideHighlight='organiser';const g=guidance(s);say(g.en,g.zh);speak(g.en);return;}if(a==='start'){if(!s.prepared)return;cancelVoice();destination=null;keys.clear();commit('start');notice='✓ 任务已领取';heardBy='organiser';lastQuestion='';npcLine=missionBrief.en;npcZh=missionBrief.zh;npcReplies.organiser={en:npcLine,zh:npcZh};rememberSpeaker(NPCS.find(n=>n.id==='organiser'));render();speak(npcLine);return;}if(a==='brief'){say('Pip is a small white robot. It has a blue light.','Pip 是白色小机器人，有一盏蓝灯。');return;}if(a==='record'){commit('clue','record');say('The note says: blue light flashing. Pip flashes blue when it follows something bright.','设备记录已收集：蓝灯闪烁。Pip 追逐明亮的物品时会闪蓝灯。');return;}if(a==='ask-library'||a==='ask-art'||a==='ask-follow'){say(a==='ask-library'?'The librarian is listening. What would you like to ask?':a==='ask-art'?'The art club member is here. Ask where the decoration went.':'Pip is ready. Tell it to come with you.',a==='ask-library'?'管理员在听。试着问她是否见过机器人。':a==='ask-art'?'美术社成员就在这里，问问装饰物去了哪里。':'Pip 准备好了，用英语邀请它跟你走。');focusInput();return;}if(a==='example-library'){speak('Have you seen a small robot?');return;}if(a==='gym'){say('I haven’t seen a robot here. Try asking at the library.','工作人员说这里没见过机器人，可以去图书馆问问。');return;}if(a==='blue'){if(s.clues.length<3){say('We need more evidence. Let’s check our notes before choosing.','还需要收集三条线索，才能确认目标。');return;}chosen=true;say('That’s Pip! Press the green button, then wait for the blue light.','找到 Pip 了！按绿色按钮，等待蓝灯亮起。');return;}if(a==='red'||a==='wrong-button'){say('Take another look. What colour did the instructions mention?','再想一想，描述或说明里提到的是哪种颜色？可以重听。');return;}if(a==='green'&&chosen){commit('wake');heardBy='pip';npcLine='I’m awake! Ask me to come with you.';npcZh='我醒了！邀请我跟你一起走吧。';npcReplies.pip={en:npcLine,zh:npcZh};render();speak(npcLine);return;}if(a==='finish'){commit('finish');if(s.complete){view='review';say('You did it! Where did you find Pip?','你完成了任务！试着用英语讲讲在哪里找到了 Pip。');}return;}if(a==='voice-preview'){textOnly=false;speak('Hello! I’m Nova, your English coach. Let’s explore together.');return;}if(a==='transfer-audio'||a==='transfer-slow'){speak('The robot is behind the gym.',a==='transfer-slow');return;}if(a==='transfer-right'){transfer=true;notice='正确！这次地点换成了体育馆。';render();return;}if(a==='transfer-wrong'){notice='再听一次，注意 gym 和 behind。';render();return;}if(a==='listen'||a==='slow'){speak(message,a==='slow');return;}if(a==='stop'){stopSpeech();return;}if(a==='subtitle'){subtitles=!subtitles;render();return;}if(a==='phrase-help'){submit('这句话怎么说');return;}if(a==='hint'){const h=!s.started?['Where does our mission start?','Look for the festival organiser.','Go to the plaza and collect the mission.']:s.clues.length<3?['What evidence do we have so far?','A witness and the art room may help.','Ask the librarian about Pip. Check the art room note and ask about the decoration.']:!s.awake?['What does Pip look like?','Remember the blue light.','Visit the greenhouse, select the blue-light robot, and press the green button.']:!s.following?['Pip is ready to move.','How can you invite it along?','Try saying: Follow me, Pip.']:['Where did we start?','The festival needs Pip back.','Return to the plaza and hand in the mission.'];say(h[Math.min(hint++,2)],`提示 ${Math.min(hint,3)}/3 · ${goal()}。由你决定并完成操作。`);return;}if(a==='mic'){mic('coach');return;}if(a==='reset'){const d=document.createElement('dialog');d.innerHTML='<h2>重新开始冒险？</h2><p>这会清除本浏览器里的当前关卡进度。</p><div class="actions"><button class="secondary" id="cancel-reset">继续冒险</button><button class="primary" id="confirm-reset">确认重置</button></div>';document.body.append(d);d.showModal();d.querySelector('#cancel-reset').onclick=()=>d.remove();d.querySelector('#confirm-reset').onclick=()=>{cancelVoice();stopSpeech();s=initial();player={x:150,y:460};companion={x:115,y:480};destination=null;keys.clear();nearby=null;npcLine='';npcZh='';heardBy='';lastQuestion='';npcReplies={};npcResponses={};npcTopics={};listeningContext=null;discussionActive=false;discussionChecking=false;try{localStorage.removeItem('campus-position');localStorage.removeItem(KEY);}catch{}view='welcome';transfer=false;chosen=false;hint=0;guideHighlight='';coachStatus='';d.remove();notice='🔄 进度已重置，我们重新出发。';const g=guidance(s);say(g.en,g.zh);};return;}}
let voiceDisplay=null;
function voiceMessage(state){
 if(state.error)return state.error;
 return ({preparing:'正在准备麦克风和语音检测…',listening:'正在听，请开始说话',speaking:'正在听，你可以继续说',waiting:`等待你继续 · 静音 ${((2000-state.remaining)/1000).toFixed(1)} / 2 秒`,reconnecting:'正在继续识别，已保留前面的话',finalizing:'正在整理完整转写…',review:'有一部分文字尚未定稿，请确认或重说',done:'本次完整识别结果',empty:'没有识别到内容，请重说',cancelled:'已取消，本次内容没有提交'})[state.phase]||'';
}
function voiceTriggerButton(target,idleLabel){return btn(recording?'■ 说完了':'🎙 '+idleLabel,target==='story'?'story-mic':target==='coach'?'coach-talk':'npc-mic','primary'+(recording?' recording':''));}
function voicePanel(target,npcId=''){
 const d=voiceDisplay;if(!d||d.target!==target||(target==='npc'&&d.npcId!==npcId))return '';
 const live=recording&&d.phase!=='review';
 return `<section class="voice-capture" aria-label="本次语音输入"><strong data-voice-state role="status">${esc(voiceMessage(d))}</strong><p class="voice-live" data-voice-live>${esc(d.text||'识别内容会显示在这里')}</p><div class="actions">${live?btn('说完了','voice-finish','primary','data-voice-stop '+(['preparing','finalizing'].includes(d.phase)?'disabled':''))+btn('取消','voice-cancel'):''}${d.phase==='review'?btn('确认并发送','voice-confirm-text','primary'):''}${!live?btn('重新说一次','voice-retry','chip'):''}</div></section>`;
}
function updateVoiceLive(){if(!voiceDisplay)return;document.querySelectorAll('[data-voice-state]').forEach(el=>el.textContent=voiceMessage(voiceDisplay));document.querySelectorAll('[data-voice-live]').forEach(el=>el.textContent=voiceDisplay.text||'识别内容会显示在这里');document.querySelectorAll('[data-voice-stop]').forEach(el=>el.disabled=['preparing','finalizing'].includes(voiceDisplay.phase));}
function cancelVoice(renderUI=false){const turn=recording;recording=null;turn?.abort();if(turn&&voiceDisplay)voiceDisplay={...voiceDisplay,phase:'cancelled'};if(renderUI)render();}
function deliverVoice(d){
 if(d.target==='npc'){if(view==='map'&&nearest(player,s)?.id===d.npcId)npcSubmit(d.text);else{d.phase='cancelled';render();}}
 else if(d.target==='story'){if(activeStory)storyAnswer(d.text);else{d.phase='cancelled';render();}}
 else submit(d.text);
}
function mic(target='npc'){
 if(recording){if(voiceDisplay?.phase!=='preparing')recording.stop();return;}
 if(target==='story'&&!activeStory)return;
 const contact=nearest(player,s);if(target==='npc'&&s.prepared&&contact?.id==='organiser'&&!s.complete){if(interactionMode(contact,s)==='mission')action('start');else replayNpc(contact);return;}
 if(s.complete&&target==='npc'){speak(reply(nearest(player,s)||NPCS[0],s,'').en);return;}
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){const error='此浏览器不支持语音识别，请使用文字交流。';if(target==='coach')coachStatus=error;else micError=error;render();openTyping(target);return;}
 if(target==='npc'&&(!contact||!s.prepared))return;
 const start=()=>{
  micApproved=true;stopSpeech();destination=null;keys.clear();micError='';coachStatus='';
  voiceDisplay={target,npcId:contact?.id||'',phase:'preparing',text:'',remaining:2000};
  const turn=createVoiceTurn({Recognition:R,createVAD:createBrowserVAD,
   onUpdate:update=>{if(recording!==turn)return;voiceDisplay={...voiceDisplay,...update};updateVoiceLive();},
   onComplete:result=>{if(recording!==turn)return;recording=null;voiceDisplay={...voiceDisplay,...result,phase:!result.text?'empty':result.needsReview?'review':'done'};render();if(result.text&&!result.needsReview)deliverVoice(voiceDisplay);},
   onError:(code,text)=>{if(recording!==turn)return;recording=null;const errors={'not-allowed':'麦克风权限未开启，请允许后重试或打字。','no-speech':'没有检测到说话，请重新说一次。','vad-unavailable':'语音检测未能启动，请重试或打字，不会提前提交。','vad-stalled':'语音检测中断，本次没有提交，请重说。','not-ready':'语音还没准备好，请重新开启。','network':'浏览器语音服务连接失败，本次没有提交。','recognition-restarts':'识别服务多次中断，本次没有提交，请重试。','recognition-timeout':'识别服务启动超时，请重试或打字。'};voiceDisplay={...voiceDisplay,text,phase:'error',error:errors[code]||'语音识别中断，本次没有提交，请重新说一次或打字。'};render();}
  });
  recording=turn;render();void turn.start();
 };
 if(micApproved){start();return;}
 const d=document.createElement('dialog');d.innerHTML='<h2>开启语音交谈</h2><p>说话时持续识别，连续静音 2 秒后才回答，也可以点“说完了”。语音活动检测在本地运行；浏览器可能使用其远程语音服务。本应用不保存录音。</p><div class="actions"><button class="secondary" id="no-mic">改用文字</button><button class="primary" id="yes-mic">开启麦克风</button></div>';document.body.append(d);d.showModal();d.querySelector('#no-mic').onclick=()=>{d.remove();openTyping(target);};d.querySelector('#yes-mic').onclick=()=>{d.remove();start();};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.speak){speak(b.dataset.speak);return;}if(b.dataset.action)action(b.dataset.action,b.dataset.value);});document.addEventListener('submit',e=>{if(e.target.id==='npc-talk'){e.preventDefault();npcSubmit(new FormData(e.target).get('question')||'');return;}if(e.target.id==='story-talk'){e.preventDefault();storyAnswer(new FormData(e.target).get('answer')||'');return;}if(e.target.id!=='talk')return;e.preventDefault();submit(new FormData(e.target).get('utterance')||'');});render();

document.addEventListener('change',e=>{if(e.target.matches('[data-rate-choice]')){const rate=Number(e.target.value);if(!speechRates.includes(rate))return;stopSpeech();speechRate=rate;voiceTested=false;voiceStatus='语速已设为 '+speechRate.toFixed(2)+'×，下次播放生效';try{localStorage.setItem('campus-speech-rate',String(speechRate));}catch{notice='浏览器未允许保存语速，本次设置仅在当前页面有效。';}render();return;}if(e.target.id==='voice-choice'){stopSpeech();voiceTested=false;preferredVoice=e.target.value;voiceStatus='音色已更改，点击试听确认';try{localStorage.setItem('campus-voice',preferredVoice);voiceSaveError=false;}catch{voiceSaveError=true;}render();}});
window.speechSynthesis?.addEventListener('voiceschanged',()=>{const select=document.querySelector('#voice-choice');if(select)select.innerHTML=voiceOptions();updateVoiceStatus();});

document.addEventListener('click',e=>{const world=e.target.closest('#world');if(!world||view!=='map')return;const npc=e.target.closest('[data-npc]');if(npc){const id=npc.dataset.npc;if(id==='pip'&&s.discovered&&!s.complete){winPip();return;}if(s.prepared&&nearest(player,s)?.id===id){destination=null;keys.clear();const n=nearest(player,s);if(npcAudio(n)){if(recording){cancelVoice();}replayNpc(n);}else mic('npc');}else if(!recording){targetNpc(id);}return;}if(recording)return;const rect=world.getBoundingClientRect();destination=bound({x:(e.clientX-rect.left)/rect.width*1000,y:(e.clientY-rect.top)/rect.height*600});world.focus({preventScroll:true});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const d=document.querySelector('dialog[open]');if(d)d.close();else document.querySelectorAll('.transcript[open],.typing-fallback[open]').forEach(el=>el.open=false);return;}if(view!=='map'||document.querySelector('dialog')||e.target.closest('input,textarea,select,[contenteditable=true]'))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){if(recording)return;e.preventDefault();if(!e.repeat){const d={arrowup:[0,-8],w:[0,-8],arrowdown:[0,8],s:[0,8],arrowleft:[-8,0],a:[-8,0],arrowright:[8,0],d:[8,0]}[k];player=bound({x:player.x+d[0],y:player.y+d[1]});destination=null;}keys.add(k);}if(k==='e'&&!e.repeat&&s.prepared){const n=nearest(player,s);if(n?.id==='pip'&&s.discovered&&!s.complete){e.preventDefault();winPip();}else if(n){e.preventDefault();mic('npc');}}if(k==='r'&&!e.repeat){e.preventDefault();if(lastSpoken)speak(lastSpoken);}});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();destination=null;});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();destination=null;if(recording)cancelVoice(true);}});requestAnimationFrame(frame);

document.addEventListener('focusin',e=>{if(e.target.closest('input,textarea,select')){keys.clear();destination=null;}});

</script></body></html>
