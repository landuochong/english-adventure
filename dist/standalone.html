/* ===== 游戏化视觉层（gamification） ===== */
/* 按钮：渐变填充 + 抬起/按压手感 */
.primary{background:linear-gradient(180deg,#46b884,#2f9466);color:#fff;border-radius:14px;padding:13px 20px;font-size:13px;font-weight:700;box-shadow:0 5px 0 #1f6b48,0 10px 18px #0c3a2822;transition:transform .08s ease,box-shadow .08s ease,filter .15s}
.primary:hover{filter:brightness(1.06)}
.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #1f6b48,0 4px 10px #0c3a2822}
.primary.recording{animation:rec-pulse 1.1s ease-in-out infinite}
.secondary{background:#eef3ea;border:1.5px solid #cfe0cc;color:#2f5d44;border-radius:14px;padding:12px 18px;font-size:13px;font-weight:600;box-shadow:0 4px 0 #d4e2cf;transition:transform .08s ease,box-shadow .08s ease}
.secondary:active{transform:translateY(3px);box-shadow:0 1px 0 #d4e2cf}
.chip{background:#fff;border:1.5px solid #e1e8da;color:#3a5b48;border-radius:999px;padding:9px 15px;font-size:12px;font-weight:600;box-shadow:0 3px 0 #e7eee2;transition:transform .08s ease,box-shadow .08s ease,background .15s}
.chip:hover{background:#f3f8ef}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 #e7eee2}
@keyframes rec-pulse{0%,100%{box-shadow:0 5px 0 #1f6b48,0 0 0 0 #e2555533}50%{box-shadow:0 5px 0 #1f6b48,0 0 0 9px #e2555500}}

/* 卡片：顶部彩色条 + 悬浮 */
.card{transition:transform .15s ease,box-shadow .15s ease}
.card:not(.coachpanel)::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#7bc6a0,#f3c66a);border-radius:18px 18px 0 0;z-index:1}
@media(hover:hover){.card:not(.coachpanel):hover{transform:translateY(-2px);box-shadow:0 14px 30px #0c3a2822,0 2px 0 #eef2ea}}

/* 提示 toast 入场 + 线索 +1 固定提示 */
.toast{background:linear-gradient(180deg,#fff6d8,#ffe9a6);border:1.5px solid #f0cd6e;color:#6b4d12;box-shadow:0 8px 20px #b8860b22;animation:toast-in .35s cubic-bezier(.2,1.3,.5,1)}
@keyframes toast-in{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.clue-pop{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,#fff6d6,#ffdf8f);border:2px solid #f0c44f;color:#6b4d12;font-weight:800;padding:12px 20px;border-radius:16px;box-shadow:0 12px 30px #b8860b44;animation:clue-pop 2.6s ease forwards;pointer-events:none}
@keyframes clue-pop{0%{transform:translate(-50%,-20px) scale(.9);opacity:0}12%{transform:translate(-50%,0) scale(1.06);opacity:1}82%{opacity:1}100%{transform:translate(-50%,-12px);opacity:0}}

/* 顶部 HUD + 任务追踪条 */
.topbar.hud{flex-wrap:wrap;gap:12px 16px;align-items:center}
.hud-left{display:flex;align-items:center;gap:10px}
.hud-avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(180deg,#bfe6cb,#8fcaa6);box-shadow:0 3px 0 #6fae8b}
.hud-meta{display:flex;flex-direction:column;line-height:1.15}
.hud-meta b{font-size:13px;color:#2f5d44}
.hud-meta small{font-size:10px;color:#7c887f;letter-spacing:.5px}
.quest{display:flex;align-items:center;flex-wrap:wrap;background:#eef5ea;border:1px solid #dce8d6;border-radius:999px;padding:7px 12px}
.quest-node{display:flex;align-items:center;gap:6px}
.quest-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #cfe0c9;font-size:13px;font-weight:800;color:#7a8a72}
.quest-node.done .quest-dot{background:#3fae7a;border-color:#2f9466;color:#fff}
.quest-node.active .quest-dot{background:#f3c66a;border-color:#e0a93f;color:#5a4012;box-shadow:0 0 0 4px #f3c66a33;animation:node-glow 1.6s ease-in-out infinite}
.quest-label{font-size:12px;font-weight:700;color:#5a6b54;white-space:nowrap}

.quest.quest-mini .quest-label{display:none}
.quest.quest-mini .quest-line{margin:0 5px;min-width:10px}
@keyframes node-glow{0%,100%{box-shadow:0 0 0 4px #f3c66a33}50%{box-shadow:0 0 0 7px #f3c66a10}}
.quest-goal{margin:10px 0 6px;font-size:13px;color:#3a5b48}

/* 欢迎页 → 游戏标题屏 */
.workspace.title-screen{position:relative;overflow:hidden;background:radial-gradient(130% 90% at 50% -15%,#e2f1e6,#f6f7f2)}
.workspace.title-screen::before,.workspace.title-screen::after{content:'';position:absolute;border-radius:50%;pointer-events:none;z-index:0;filter:blur(1px)}
.workspace.title-screen::before{width:280px;height:280px;left:-60px;top:-70px;background:radial-gradient(circle,#bfe6cb,transparent 70%);opacity:.6;animation:float-a 9s ease-in-out infinite}
.workspace.title-screen::after{width:220px;height:220px;right:-50px;bottom:-60px;background:radial-gradient(circle,#f6dca0,transparent 70%);opacity:.55;animation:float-b 11s ease-in-out infinite}

@keyframes float-a{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,30px)}}
@keyframes float-b{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,-22px)}}
.welcome{border-radius:22px}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.welcome .primary{font-size:17px;padding:16px 30px;animation:cta-pulse 2.2s ease-in-out infinite}
@keyframes cta-pulse{0%,100%{box-shadow:0 5px 0 #1f6b48,0 10px 18px #0c3a2822}50%{box-shadow:0 5px 0 #1f6b48,0 10px 30px #2f946670}}

/* 地图场景感 */
.world{background:linear-gradient(180deg,#dff0ea 0%,#e8eedb 40%,#e1eccd 100%);background-image:radial-gradient(#bcd0ad66 1px,transparent 1px);background-size:19px 19px}
.world-building{background:#fffaf0cc;border:2px solid #e7d9b8;border-radius:14px;padding:8px 12px;box-shadow:0 5px 0 #d8c79e,0 6px 12px #00000012}

.npc-name{position:relative;background:#fff;color:#2f4a3a;border:1px solid #e3e8da;box-shadow:0 2px 6px #00000012}

/* 胜利：关卡完成横幅 + 三星 */

.stories{padding:26px 30px}

.story-terms .term-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

.story-step{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e3ead9;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:#5a6b54;box-shadow:0 3px 0 #e0e8d6;transition:transform .08s ease,box-shadow .08s ease,background .15s,border-color .15s}

@keyframes story-enter{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

@media(prefers-reduced-motion:reduce){.clue-pop,.welcome-portrait,.welcome .primary,.quest-node.active .quest-dot,.destination:not([hidden]),.world-actor.player>span,.primary.recording,.workspace.title-screen::before,.workspace.title-screen::after,.toast,.story-card,.stories.detail{animation:none!important}}

</style></head><body><div id="app"></div><script type="module">
/* ===== scene-conversation.js ===== */
// Scripted, task-scoped clarification. Never silently replace the raw transcript.
const slot=(key,expected,question,zh,choices,ambiguity)=>({key,expected,question,zh,choices,ambiguity});
const conversationPlans={
 'school.borrow':[
  slot('book','maths','Which book would you like to borrow?','你想借哪本书？',[[/\b(math|maths|mathematics)\s*(book|textbook)\b/,'maths'],[/\b(english|science|history)\s*(book|textbook)\b/,'other']],{pattern:/\bmac\s*book\b/,value:'maths',en:'Do you mean my maths book?',zh:'你是说我的数学课本吗？'})],
 'restaurant.order':[
  slot('food','chicken','What would you like to eat?','你想吃什么？',[[/\bchicken\s+sandwich\b/,'chicken'],[/\b(tuna|beef|cheese)\s+sandwich\b|\bpizza\b/,'other']]),
  slot('onions','without','Would you like onions?','你要加洋葱吗？',[[/\b(no|without)\s+(any\s+|the\s+)?onions?\b/,'without'],[/\b(with|add|extra)\s+(some\s+)?onions?\b/,'with']],{pattern:/\bwithout\s+(the\s+)?audience\b/,value:'without',en:'Did you say no onions? Is that right?',zh:'你说的是不要洋葱，对吗？'}),
  slot('drink','water','What would you like to drink?','你想喝什么？',[[/\bwater\b/,'water'],[/\b(juice|cola|coffee|tea)\b/,'other']])],
 'shopping.buy':[
  slot('item','cap','What would you like to buy?','你想买什么？',[[/\bcap\b/,'cap'],[/\b(shirt|shoes|coat)\b/,'other']]),
  slot('colour','blue','Which colour would you like?','你想要什么颜色？',[[/\bblue\b/,'blue'],[/\b(red|green|black|white)\b/,'other']]),
  slot('size','medium','Which size would you like?','你想要什么尺码？',[[/\bmedium\b/,'medium'],[/\b(small|large)\b/,'other']])],
 'directions.bus':[
  slot('question','museum','Where do you want to go? Ask me about a bus or the way there.','你要去哪里？可以问我公交或路线。',[[/^(?=.*\b(what|where|when|which|how|have|has|do|does|did|can|could|may|is|are|will|would|tell)\b)(?=.*\b(bus|way|get|go)\b)(?=.*\bmuseum\b)(?!.*\bboss\b)/,'museum']],{pattern:/^(?=.*\b(which|what|how|can|could)\b)(?=.*\bboss\b)(?=.*\bmuseum\b)/,value:'museum',en:'Do you mean which bus goes to the museum?',zh:'你是想问哪路公交车去博物馆吗？'})],
 'directions.route':[
  slot('bus','five','Which bus should I take?','我应该坐哪路公交？',[[/\b(bus\s*(number\s*)?(five|5)|(number\s*)?(five|5)\s+bus)\b|^(five|5)( please)?$/,'five'],[/\bbus\s*(number\s*)?(six|6|four|4)\b/,'other']]),
  slot('stop','library','Where should I get off?','我应该在哪里下车？',[[/\b(get off|stop|off at)\b.*\blibrary\b|^(at )?(the )?library( please)?$/,'library'],[/\b(get off|stop|off at)\b.*\b(park|school|station)\b/,'other']]),

};
const yesReply=t=>/^(yes|yeah|yep|correct|right|that'?s right|yes that'?s right|yes please)(\s+please)?$/.test(t);
const noReply=t=>/^(no|nope|no thanks|no thank you|that'?s wrong)$/.test(t);
function conversationQuestion(plan,draft){
 const field=plan.find(f=>f.key===draft.pending);
 if(field)return {en:field.ambiguity.en,zh:field.ambiguity.zh};
 const missing=plan.find(f=>draft.values[f.key]!==f.expected);
 if(!missing)return null;
 draft.asked=missing.key;
 return {en:(draft.values[missing.key]?'That does not match your friend’s request. Let us check that part. ':'')+missing.question,zh:(draft.values[missing.key]?'这和同伴的需求不一致，我们再确认这一项。':'')+missing.zh};
}
function restoreConversation(key,raw){
 const plan=conversationPlans[key];if(!plan||!raw)return null;
 const d={values:{},pending:null,asked:null};
 for(const f of plan)if(f.choices.some(([,value])=>value===raw.values?.[f.key]))d.values[f.key]=raw.values[f.key];
 if(plan.some(f=>f.key===raw.pending&&f.ambiguity))d.pending=raw.pending;
 if(plan.some(f=>f.key===raw.asked))d.asked=raw.asked;
 return d;
}
function continueConversation(key,draft,text){
 const plan=conversationPlans[key];const d=draft||{values:key==='shopping.buy'?{item:'cap',colour:'blue'}:{},pending:null,asked:null};
 const t=text.replace(/^(no\s+)?(sorry\s+)?i (meant|mean)\s+/,'').replace(/^no\s+(actually\s+)?(?=(water|blue|medium|saturday|sunday|without|maths|mathematics)\b)/,'').replace(/\b(i )?(do not|don't) want (any )?onions?\b/g,'no onions');
 // Broad negation is not confirmation; only the specific no-onions construction is allowed.
 if(/\b(not|never|don't|doesn't|didn't|can't|cannot|won't)\b/.test(t))return {draft:d,response:conversationQuestion(plan,d),complete:false};
 if(key==='school.borrow'&&!draft&&!/\b(borrow|lend|use|have)\b/.test(t)&&!/\bplease\b/.test(t))return {draft:d,response:conversationQuestion(plan,d),complete:false};
 const hadPending=!!d.pending;
 if(d.pending){
  const f=plan.find(f=>f.key===d.pending);
  if(yesReply(t)){d.values[f.key]=f.ambiguity.value;d.pending=null;}
  else if(noReply(t)){delete d.values[f.key];d.pending=null;d.asked=f.key;return {draft:d,response:{en:'Okay. '+f.question,zh:'好的，'+f.zh},complete:false};}
 }
 // A short yes/no answers only an explicit question about onions, never an entire task.
 if(!hadPending&&!d.pending&&key==='restaurant.order'&&d.asked==='onions'){
  if(noReply(t))d.values.onions='without';
  else if(yesReply(t))d.values.onions='with';
 }
 const plausible=key==='directions.bus'||/\b(can|could|may|would|please|like|want|need|borrow|lend|take|go|come|join|get|bring|here|is)\b/.test(t)||t.split(' ').length<=6;
 if(plausible){
  for(const f of plan){
   const values=[...new Set(f.choices.filter(([re])=>re.test(t)).map(([,v])=>v))];
   if(values.length===1){d.values[f.key]=values[0];if(d.pending===f.key)d.pending=null;}
   else if(values.length>1){delete d.values[f.key];d.pending=null;d.asked=f.key;}
   if(f.ambiguity?.pattern.test(t)){delete d.values[f.key];d.pending=f.key;}
  }
  // 'It' refers only to the blue cap whose price was established in the preceding turn.
  if(key==='shopping.buy'&&/\b(it|this|that)\b/.test(t)){d.values.item??='cap';d.values.colour??='blue';}
 }
 const response=conversationQuestion(plan,d);
 return {draft:d,response,complete:!response};
}

};

function newSceneState(){return {prepared:false,started:false,done:[],conversation:null,replies:{},journal:[],complete:false,tries:0,player:{x:120,y:450}};}
function restoreSceneState(id,raw){
 const st=newSceneState(),w=dailyScenes[id];if(!w||!raw||typeof raw!=='object')return st;
 st.prepared=raw.prepared===true;st.started=st.prepared&&raw.started===true;
 if(st.started)for(const a of w.actions){if(!Array.isArray(raw.done)||!raw.done.includes(a.id))break;st.done.push(a.id);}
 st.complete=st.done.length===w.actions.length;st.tries=Number.isFinite(raw.tries)?Math.max(0,raw.tries):0;
 if(Number.isFinite(raw.player?.x)&&Number.isFinite(raw.player?.y))st.player={x:Math.max(50,Math.min(950,raw.player.x)),y:Math.max(70,Math.min(530,raw.player.y))};
 // Reconstruct only earned information, never trust unearned cached answers.
 if(st.started){st.replies[w.giver]=w.mission;st.journal.push({npc:w.giver,...w.mission});}
 for(const a of w.actions.filter(a=>st.done.includes(a.id))){st.replies[a.npc]=a.reply;st.journal.push({npc:a.npc,...a.reply});}
 const next=sceneNext(id,st),key=next&&id+'.'+next.id;
 if(st.started&&next&&raw.conversation?.key===key){const draft=restoreConversation(key,raw.conversation.draft);if(draft){st.conversation={key,draft};st.lastNpc=next.npc;st.response=conversationQuestion(conversationPlans[key],draft);}}
 return st;
}
function sceneNear(id,st){return dailyScenes[id]?.npcs.filter(n=>Math.hypot(n.x-st.player.x,n.y-st.player.y)<=90).sort((a,b)=>Math.hypot(a.x-st.player.x,a.y-st.player.y)-Math.hypot(b.x-st.player.x,b.y-st.player.y))[0]||null;}
function sceneNext(id,st){return dailyScenes[id].actions.find(a=>!st.done.includes(a.id));}
// A reply is not the same as finishing a conversation. Reopen the giver when the return step becomes current.
function sceneContactMode(id,st,npcId){
 const w=dailyScenes[id];
 if(!st.started&&npcId===w.giver)return 'mission';
 if(!st.complete&&sceneNext(id,st)?.npc===npcId)return 'ask';
 return st.replies[npcId]?'replay':'ask';
}
function sceneInteract(id,st,npcId,text=null){
 const w=dailyScenes[id],n=w?.npcs.find(n=>n.id===npcId);
 if(!n||!st.prepared||sceneNear(id,st)?.id!==npcId)return null;
 if(!st.started){if(npcId!==w.giver)return scenePair('Please speak to your friend first. I do not know what you need yet.','先和同伴交谈，我还不知道你需要什么。');st.started=true;st.replies[npcId]=w.mission;st.journal.push({npc:npcId,...w.mission});return w.mission;}
 if(text===null)return (st.lastNpc===npcId&&st.response)||st.replies[npcId]||scenePair('Hello! What would you like to ask?','你好，你想问什么？');
 if(st.complete)return st.replies[npcId]||scenePair('Well done! You finished your task.','做得好，任务完成了。');
 const a=sceneNext(id,st);st.tries++;
 if(a.npc!==npcId)return scenePair('You still have something to do with someone else. Check what you have heard, or ask Nova for help.','你还有需要和其他人交流的事。可以重听已获得的信息，或向 Nova 求助。');
 let t=String(text).toLowerCase().replace(/[’']/g,"'").replace(/[?.!,]/g,' ').replace(/\s+/g,' ').trim();
 if(/\b(again|repeat|slower|slowly)\b/.test(t))return (st.lastNpc===npcId&&st.response)||st.replies[npcId]||scenePair('Please ask me about what you need first.','请先问我你需要的信息。');
 const key=id+'.'+a.id;
 if(!/[a-z]/.test(t)||/[\u3400-\u9fff]/.test(t))return scenePair(...sceneClarifications[id][st.done.length]);
 if(conversationPlans[key]){
  const previous=st.conversation?.key===key?st.conversation.draft:null;
  const result=continueConversation(key,previous,t);st.conversation={key,draft:result.draft};
  if(!result.complete){st.lastNpc=npcId;st.response=result.response;return result.response;}
 }else{
  t=t.replace(/^(no\s+)?(sorry\s+)?i (meant|mean)\s+/,'');
  const negated=/\b(not|never|don't|doesn't|didn't|can't|cannot|won't|no)\b/.test(t);
  if(negated||!a.test(t))return scenePair(...sceneClarifications[id][st.done.length]);
 }
 st.conversation=null;st.response=null;
 st.done.push(a.id);st.replies[npcId]=a.reply;st.journal.push({npc:npcId,...a.reply});st.complete=st.done.length===w.actions.length;return a.reply;

function sceneCoach(id,st,text='next',context=null){
 const w=dailyScenes[id],t=text.toLowerCase(),last=context||st.journal.at(-1);

 const word=sceneVocabulary[id].find(([en])=>t.includes(en.toLowerCase()));
 if(word&&(/mean|what|explain|解释|意思|词/.test(t)||t===word[0].toLowerCase()))return scenePair(word[2],word[0]+'：'+word[1]);
 if(/mean|word|关键词|词/.test(t)){const term=sceneVocabulary[id].find(([en])=>last?.en.toLowerCase().includes(en.toLowerCase()))||sceneVocabulary[id][0];return scenePair(term[2]+' Listen to the person again and find that detail.',term[0]+'：'+term[1]+'。再听人物的话，找出这部分信息。');}
 if(/understand|detail|explain|解释|听不懂|细节|理解/.test(t)&&last)return scenePair('Let us take one part at a time. '+last.en.split(/(?<=[.!?])\s+/)[0]+' Listen for the important words. Then ask me about a word, or replay the whole message.', '先听第一部分：'+last.zh.split(/[。？！]/)[0]+'。注意关键词，也可以向我问某个词的意思，或重听整段。');
 if(st.complete)return scenePair('You did it yourself! Look back at the conversations you had.','你自己完成了任务！可以回顾刚才的交流。');
 if(!st.started)return w.intro;
 return sceneNext(id,st).hint;
}

const initial = () => ({version:1,entered:false,prepared:false,location:'plaza',mode:'companion',started:false,clues:[],discovered:false,awake:false,following:false,complete:false,practice:0});
function transition(s,action,value){
 const n={...s,clues:[...s.clues]};
 if(action==='enter')n.entered=true;
 if(action==='prepare'){n.prepared=true;n.entered=true;}
 if(action==='move'&&['plaza','library','art','greenhouse','gym'].includes(value))n.location=value;
 if(action==='mode')n.mode=value==='voice'?'voice':'companion';
 if(action==='start'&&n.prepared&&n.location==='plaza')n.started=true;
 if(action==='clue'&&n.started&&((value==='witness'&&n.location==='library')||(['record','decoration'].includes(value)&&n.location==='art'))&&!n.clues.includes(value))n.clues.push(value);
 if(action==='discover'&&n.started&&n.clues.length===3&&n.location==='greenhouse'){n.discovered=true;}
 if(action==='complete'&&n.discovered&&!n.complete)n.complete=true;
 if(action==='wake'&&n.discovered&&n.location==='greenhouse'&&n.clues.length===3)n.awake=true;
 if(action==='follow'&&n.location==='greenhouse'&&n.awake)n.following=true;
 if(action==='finish'&&n.location==='plaza'&&n.following)n.complete=true;
 if(action==='practice')n.practice++;
 return n;
}
function restore(raw){try {const s=JSON.parse(raw);if(s?.version!==1||!['plaza','library','art','greenhouse','gym'].includes(s.location)||!Array.isArray(s.clues))return initial();const n=initial();for(const key of ['entered','prepared','started','awake','following','complete'])n[key]=s[key]===true;if(n.prepared)n.entered=true;n.location=s.location;n.mode=s.mode==='voice'?'voice':'companion';n.clues=[...new Set(s.clues.filter(x=>['witness','record','decoration'].includes(x)))];n.practice=Number.isInteger(s.practice)&&s.practice>=0?s.practice:0;if(!n.started)n.clues=[];n.discovered=(s.discovered===true||s.awake===true)&&n.started&&n.clues.length===3;n.awake=n.awake&&n.discovered;n.following=n.following&&n.awake;n.complete=n.discovered&&(s.complete===true||s.complete!==false);return n;}catch{return initial();}}

function canNavigate(s,target){return ['prep','map','notebook','review'].includes(target)&&(s.entered||s.prepared)&&(target==='prep'||s.prepared)||target==='stories';}

// 与 discussClue 风格一致：处理“检查题 / 问词义 / 请再说一遍 / 答对了 / 答错”等分支。
// checking=true 时，用 answer 正则判定用户是否答对（排除否定词）。
function discussStory(id, text, checking = false) {
  const d = stories[id];
  if (!d) return { en: 'No story here yet.', zh: '这里还没有故事。', checking: false };
  const t = text.toLowerCase();

  if (checking && !/意思|解释|听不懂|mean|explain|understand|why/.test(t)) {
    const negated = /\b(no|not|never|didn't|didn’t)\b|不是|没有|没/.test(t);
    const matches = d.answer.test(t) && !negated;
    const pair = matches ? d.feedback : (d.wrong || [d.simple[0] + ' ' + d.check[0], d.simple[1] + ' ' + d.check[1]]);
    return { en: pair[0], zh: pair[1], checking: !matches };
  }

  if (/检查|复述|check|test|quiz/.test(t)) return { en: d.check[0], zh: d.check[1], checking: true };

  const term = d.terms && Object.keys(d.terms).find(w => t.includes(w));
  if (term) return { en: d.terms[term][0], zh: d.terms[term][1], checking: false };

  if (/为什么|why/.test(t)) return {
    en: 'This story shows one small moment in daily life. What did you hear about the people?',
    zh: '这个故事展示了日常生活中的一个小片段。你从人物身上听到了什么？'
  };

  if (/词|意思|mean|word|vocab/.test(t)) return { en: d.words[0], zh: d.words[1], checking: false };

  if (/听不懂|不明白|讨论|解释|换|简单|detail|explain|understand|simpl|rephrase|said|say/.test(t))
    return { en: d.simple[0], zh: d.simple[1], checking: false };

  return {
    en: 'Stay with ' + d.name + '’s story. Ask about a word, ask me to say it again, or try the check question.',
    zh: '我们继续看 ' + d.name + ' 的故事。可以问词义、请我再说一遍，或回答问题。',
    checking: false
  };
}

/* ===== speech.js ===== */
function englishVoices(voices) {
  return voices.filter(v => /^en(?:[-_]|$)/i.test(v.lang));
}
const voiceKey = v => JSON.stringify({name:v.name,lang:v.lang.toLowerCase().replace('_','-')});
function chooseVoice(voices, preferred = '') {
  const english=englishVoices(voices);
  // Empty means Google US English, not an unspecified system voice.
  if(!preferred)return english.find(v=>/google/i.test(v.name)&&/^en[-_]US$/i.test(v.lang))||null;
  // Stable identity survives voiceURI changes. Keep old saved URI selections compatible.
  return english.find(v=>voiceKey(v)===preferred||v.voiceURI===preferred)||null;
}
function loadVoices(synth, timeout = 2500, ready = voices => voices.length > 0) {
  if(ready(synth.getVoices()))return Promise.resolve(synth.getVoices());
  return new Promise(resolve=>{
    let timer,poll;
    const finish=()=>{clearTimeout(timer);clearInterval(poll);synth.removeEventListener('voiceschanged',changed);resolve(synth.getVoices());};
    const changed=()=>{if(ready(synth.getVoices()))finish();};
    synth.addEventListener('voiceschanged',changed);
    timer=setTimeout(finish,timeout);poll=setInterval(changed,100);changed();
  });
}

const normalise=text=>String(text).toLowerCase().replace(/[’]/g,"'").replace(/\b(where|what|who|how)'s\b/g,'$1 is').replace(/'/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
function mentionsTask(text){return /\b(pip|robots?)\b/.test(normalise(text));}
function assessQuestion(person,text,{topicEstablished=false}={}){
 const t=normalise(text),explicit=mentionsTask(text);
 const response=(kind,en,zh)=>({kind,en,zh});
 if(!t||/[\u3400-\u9fff]/.test(text))return response('clarify','Could you try asking in English? Nova can help you.','试着用英语提问，Nova 可以帮你组织表达。');
 if(/^(hi|hello|hey|good morning|good afternoon|good evening)( there)?$/.test(t))return response('greeting','Hello! What would you like to ask me?','你好！你想问我什么？');
 if(/^(thanks|thank you|thank you very much|thanks a lot|bye|goodbye)$/.test(t))return response('social','You’re welcome. Let me know if you have a question.','不用谢，有问题可以再问我。');
 const question=t.replace(/^(?:hi|hello|hey|excuse me|please)\s+/,'');
 const asks=/^(?:where|whereabouts|what|which|why|how)\b/.test(question)||/\b(?:have|has|did|do|does|can|could|would|will)\s+(?:you|i|we|they|he|she|it|anyone|anybody|someone|somebody)\b.*\b(?:see|seen|saw|know|find|locate|go|went|gone|happen|happened|help|tell|show|explain|mean|means|flash|flashing|carry|carried|take|took|move|moved|record|records)\b|\b(?:tell|show|explain|describe)\b.*\b(?:me|us|please)\b|^you (?:seen|see|know)\b|^(?:location|whereabouts) please\b/.test(t);
 const reference=explicit||(topicEstablished&&/\b(it|him|its)\b/.test(t));
 const appearance=reference&&/\b(?:what colou?r|what does .* look like|describe)\b/.test(t);
 if(appearance)return response('appearance','Pip is a small white robot with a blue light. What else would you like to know?','Pip 是带蓝灯的小白色机器人。你还想了解什么？');
 const offTopic=/\b(?:your name|how are you|weather|football|basketball|favo[u]?rite|pizza|birthday|age|joke)\b/.test(t);
 const observation=/\b(?:seen|see|saw|know|find|locate|looking|missing|go|went|gone|happen|happened|where|whereabouts|location)\b/.test(t);
 const requestForHelp=/\b(?:looking for|trying to find)\b.*\b(?:pip|robot)\b.*\b(?:can|could|would|will)\b.*\bhelp\b/.test(t);
 const roleTopic=person.id==='artist'?/\b(?:decoration|decorations|shiny object)\b/.test(t):person.id==='technician'?/\b(?:records?|blue light|flash|flashing)\b/.test(t):false;
 if(!offTopic&&((reference&&asks&&observation)||requestForHelp||(roleTopic&&asks)))return {kind:'relevant'};
 if(explicit&&!asks&&!offTopic)return response('clarify','What would you like to know about the missing robot?','你想了解这个失踪机器人的什么信息？');
 if(asks&&!reference&&!roleTopic&&!offTopic)return response('clarify','Who or what are you asking about?','你问的是谁，或什么东西？');
 return response('off-topic','I can help with the missing robot. What would you like to ask?','我可以提供与失踪机器人有关的信息，你想问什么？');
}

// A recognition result is a revision of the current session, never a new utterance.
class TranscriptBuffer {
 constructor(){this.completed=[];this.current=[];}
 update(results){this.current=Array.from(results,r=>({text:(r[0]?.transcript||'').trim(),final:r.isFinal===true}));}
 commit(){this.completed.push(...this.current);this.current=[];}
 snapshot(){const all=[...this.completed,...this.current].filter(r=>r.text);return {text:all.map(r=>r.text).join(' '),needsReview:all.some(r=>!r.final)};}
}
class SilenceGate {
 constructor({silenceMs=2000,threshold=.35}={}){this.silenceMs=silenceMs;this.threshold=threshold;this.heard=false;this.lastSpeech=null;this.lastFrame=null;}
 speechStart(now){this.heard=true;this.lastSpeech=now;}
 frame(probability,now){this.lastFrame=now;if(probability>=this.threshold)this.lastSpeech=now;}
 state(now){const elapsed=this.lastSpeech===null?0:Math.max(0,now-this.lastSpeech);return {heard:this.heard,remaining:this.heard?Math.max(0,this.silenceMs-elapsed):this.silenceMs,ended:this.heard&&elapsed>=this.silenceMs,stale:this.lastFrame!==null&&now-this.lastFrame>1000};}
}

function pcmWav(frames){
 const length=frames.reduce((n,f)=>n+f.length,0),buffer=new ArrayBuffer(44+length*2),v=new DataView(buffer);
 const str=(offset,s)=>{for(let i=0;i<s.length;i++)v.setUint8(offset+i,s.charCodeAt(i));};
 str(0,'RIFF');v.setUint32(4,36+length*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,16000,true);v.setUint32(28,32000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,length*2,true);
 let offset=44;for(const frame of frames)for(const sample of frame){const x=Math.max(-1,Math.min(1,sample));v.setInt16(offset,x*(x<0?32768:32767),true);offset+=2;}return buffer;
}

 const fail=async code=>{if(closed)return;closed=true;controller.abort();frames=[];await release().catch(()=>{});onError(code,'');};

  if(closed||finishing)return;if(!ready){await fail('not-ready');return;}finishing=true;update('finalizing');

   if(closed){await loaded.destroy();return;}vad=loaded;ready=true;started=performance.now();gate.frame(0,started);await vad.start();if(closed)return;update('listening');

  }catch(e){await fail(e.name==='NotAllowedError'?'not-allowed':'local-asr');}
 }

}

export async function createBrowserVAD(callbacks,{getStream}={}){

  await context.resume();await load();
  const mic=await window.vad.MicVAD.new({model:'v5',startOnLoad:false,audioContext:context,baseAssetPath:base.href,onnxWASMBasePath:base.href,positiveSpeechThreshold:.5,negativeSpeechThreshold:.35,minSpeechMs:160,redemptionMs:3000,submitUserSpeechOnPause:false,getStream:acquire,...callbacks});

}

function frame(time){const dt=Math.min((time-lastFrame)/1000||0,.05);lastFrame=time;
 if(view==='map'&&!document.querySelector('dialog')&&!recording){let dx=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0),dy=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);const before={...player};if(dx||dy){destination=null;const len=Math.hypot(dx,dy);player=bound({x:player.x+dx/len*175*dt,y:player.y+dy/len*175*dt});}else if(destination){player=step(player,destination,175*dt);if(distance(player,destination)<1)destination=null;}

 if(distance(before,player)>.01&&time-lastSave>500){lastSave=time;try{localStorage.setItem('campus-position',JSON.stringify(player));}catch{}}
 }

 document.querySelectorAll('.world-npc').forEach(el=>{const n=NPCS.find(n=>n.id===el.dataset.npc);const near=nearest(player,s)?.id===n.id;el.classList.toggle('near',near);el.classList.toggle('guide-target',n.id===guideHighlight);if(near&&n.id===guideHighlight)guideHighlight='';const issuing=interactionMode(n,s)==='mission',audio=npcAudio(n),marker=el.querySelector('.quest-marker'),pipWin=n.id==='pip'&&s.discovered&&!s.complete;marker.hidden=!(near&&(audio||hasInformation(n,s)||pipWin));marker.textContent=pipWin?'🤖':audio?'🔊':'?';marker.classList.toggle('replay-marker',!!audio);marker.title=pipWin?'点击 Pip，听它的感谢':audio?'点击重听这个人物的回答':issuing?'点击听取并领取任务':'点击这里，直接提问';el.setAttribute('aria-label',near&&s.prepared?(pipWin?'点击 Pip，听它的感谢':audio?'重听'+n.name+'的回答':issuing?'听取并领取 Mia 的任务':'向'+n.name+'提问'):'走向'+n.name);el.title=near?(pipWin?'点击 Pip 🤖，听它的感谢':audio?'点击喇叭重听人物的话':issuing?'点击问号，领取任务':'点击人物或问号，直接提问'):'走到人物身边';});requestAnimationFrame(frame);
}

 return `<section class="adventure story-adventure"><div class="maphead"><strong>◈ ${esc(w.title)}</strong><span class="muted">方向键 / WASD 移动 · 点击地面走过去 · E 开口交流</span></div><div class="map-goal">${st.complete?'🎉 委托完成':st.started?'听取信息，完成同伴的委托':'先走近同伴，点击红色 ? 领取任务'}</div>
 <div id="story-world" class="world scene-${w.theme}" tabindex="0" aria-label="冒险地图"><div class="scene-path" aria-hidden="true"></div>${w.places.map(([icon,label,x,y])=>`<div class="scene-place" style="left:${x}%;top:${y}%" aria-hidden="true"><span>${icon}</span><small>${label}</small></div>`).join('')}
 ${w.npcs.map(n=>`<button class="snpc ${sceneContactMode(activeStory,st,n.id)==='replay'?'talked':''} ${near?.id===n.id?'near':''}" data-snpc="${n.id}" style="left:${n.x/10}%;top:${n.y/6}%" aria-label="${esc(n.name)} · ${sceneContactMode(activeStory,st,n.id)==='replay'?'重听':'交谈'}"><span class="quest-marker" ${near?.id===n.id?'':'hidden'}>${sceneContactMode(activeStory,st,n.id)==='replay'?'🔊':'?'}</span><span class="sprite">${n.icon}</span><span class="npc-name">${esc(n.name)}</span></button>`).join('')}
 <div id="story-player" class="world-actor player" style="left:${st.player.x/10}%;top:${st.player.y/6}%"><span>🧑‍🚀</span><small>你</small></div><div id="story-companion" class="world-actor follower" style="left:${(st.player.x-50)/10}%;top:${(st.player.y+35)/6}%" ${s.mode==='voice'?'hidden':''}><span>👩🏻‍🚀</span><small>Nova</small></div></div>
 <div class="walk-controls"><span>走近 ? 交谈 · 🔊 重听 · E 再次提问</span><div>${[['↑','up'],['←','left'],['↓','down'],['→','right']].map(([icon,dir])=>btn(icon,'smove','chip',`data-value="${dir}" aria-label="${dir}"`)).join('')}</div></div>
 <section id="story-encounter" class="encounter">${storyEncounter(w,st,near)}</section>${storyQuestTracker(st,w)}
</section>`;
}
function storyCoachPanel(){const st=mstate(activeStory),c=sceneCoachLine||sceneCoach(activeStory,st);return `<aside id="scene-coach-panel" class="card scene-coach ${sceneCoachOpen?'is-open':''}" aria-label="同行教练" tabindex="-1"><button class="chip scene-coach-close" data-action="scene-coach-close" aria-label="收起教练面板">收起 ✕</button><div class="coachhead"><span class="coach-avatar">👩🏻‍🚀</span><div><strong>Nova · 同行教练</strong><small>你来行动，我帮你分析 · 预设对话</small></div></div>${rateSettings('scene-rate')}${audioPrompt()}<div class="actions">${btn('🔊 听建议','story-coach','primary')}${btn('慢速重听','story-coach-slow')}${btn('讨论刚才的信息','story-discuss')}${btn('🎙 和教练说话','scene-coach-mic')}</div>${transcript(c.en,c.zh)}${voicePanel('scene-coach')}${sceneTyping('scene-coach-talk','问问教练','utterance')}
 <details><summary>陪伴方式</summary><div class="actions">${btn('同行陪伴','scene-mode','chip','data-value="companion"')}${btn('语音陪伴','scene-mode','chip','data-value="voice"')}</div></details></aside>${btn('👩🏻‍🚀 问教练','scene-coach-open','primary scene-coach-launcher',`aria-controls="scene-coach-panel" aria-expanded="${sceneCoachOpen}"` )}`;

function sceneTyping(id,label,name){return `<details class="typing-fallback" ${textOnly?'open':''}><summary>暂时无法开口？打字交流</summary><form id="${id}" class="npc-form"><label for="${id}-input">${label}</label><div><input id="${id}-input" name="${name}" maxlength="300" autocomplete="off" placeholder="输入你想说的话"><button class="secondary" type="submit">发送 ↗</button></div></form></details>`;}
function storyEncounter(w,st,n){if(st.complete)return `<h2>🎉 任务完成！</h2>${audioPrompt()}<div class="actions">${btn('🔊 听感谢','story-resolve','primary')}${btn('🎉 重播庆祝','story-finish')}${btn('冒险回顾','story-step','chip','data-value="3"')}</div>${transcript(w.actions.at(-1).reply.en,w.actions.at(-1).reply.zh)}`;
 if(!n)return `<div class="encounter-idle"><b>走近人物，开始交流</b><p>点击人物走到身边，再点击红色问号；也可以按 E。</p></div>`;
 const r=st.lastNpc===n.id?st.response:st.replies[n.id];const giver=!st.started&&n.id===w.giver;
 return `<div class="encounter-title"><span class="npc-portrait">${n.icon}</span><div><small>面对面交流</small><h2>${esc(n.name)}</h2></div></div>${audioPrompt()}<div class="actions">${btn(recording&&voiceDisplay?.target==='scene-npc'?'■ 说完了':giver?'? 听取任务':'🎙 开口交流','scene-npc-mic','primary',`data-value="${n.id}"`)}${r?btn('🔊 重听','snpc-talk','secondary',`data-value="${n.id}"`)+btn('慢速重听','snpc-slow','secondary',`data-value="${n.id}"`):''}</div>${r?transcript(r.en,r.zh):''}${st.lastNpc===n.id&&st.lastUtterance?`<details><summary>查看本次原始输入</summary><p>${esc(st.lastUtterance)}</p></details>`:''}${voicePanel('scene-npc',n.id)}${micError?`<p role="status">${esc(micError)}</p>`:''}${giver?'':sceneTyping('scene-npc-talk','用英语向人物提问或回应','question')}`;
}
function refreshStoryEncounter(){if(!activeStory||storyStep!==1)return;const st=mstate(activeStory),near=sceneNear(activeStory,st);const el=document.querySelector('#story-encounter');if(el)el.innerHTML=storyEncounter(dailyScenes[activeStory],st,near);}
function animateStoryMove(target){if(recording||!activeStory)return;const id=activeStory,st=mstate(id),token=++storyMotion;let previous=0;const dest=bound(target);function tick(time){if(token!==storyMotion||activeStory!==id||storyStep!==1||recording)return;const dt=Math.min((time-previous)/1000||.016,.05);previous=time;st.player=step(st.player,dest,dt*260);const el=document.querySelector('#story-player');if(el){el.style.left=st.player.x/10+'%';el.style.top=st.player.y/6+'%';}const follower=document.querySelector('#story-companion');if(follower){follower.style.left=Math.max(4,(st.player.x-50)/10)+'%';follower.style.top=Math.min(92,(st.player.y+35)/6)+'%';}const near=sceneNear(id,st);document.querySelectorAll('[data-snpc]').forEach(el=>{el.classList.toggle('near',el.dataset.snpc===near?.id);el.querySelector('.quest-marker').hidden=el.dataset.snpc!==near?.id;});if(lastStoryNear!==(near?.id||null)){lastStoryNear=near?.id||null;refreshStoryEncounter();}if(distance(st.player,dest)>1)requestAnimationFrame(tick);else saveScenes();}requestAnimationFrame(tick);}
function smove(dir){if(!activeStory||storyStep!==1)return;const st=mstate(activeStory),d={up:[0,-90],down:[0,90],left:[-90,0],right:[90,0]}[dir];if(d)animateStoryMove({x:st.player.x+d[0],y:st.player.y+d[1]});}
function sceneSay(npcId,text,slow=false){const sceneId=activeStory;speak(text,slow,null,()=>{if(activeStory===sceneId){sceneSpeaker=npcId;updateSceneMarkers();}});}
function updateSceneMarkers(){
 if(!activeStory||storyStep!==1)return;
 const st=mstate(activeStory);
 document.querySelectorAll('[data-snpc]').forEach(el=>{
  const id=el.dataset.snpc,mode=sceneContactMode(activeStory,st,id),capture=recording&&voiceDisplay?.target==='scene-npc'&&voiceDisplay.sceneId===activeStory&&voiceDisplay.npcId===id;
  const speaking=sceneSpeaker===id,marker=el.querySelector('.quest-marker');
  marker.textContent=capture?'🎙':speaking?'🔉':mode==='replay'?'🔊':'?';
  marker.classList.toggle('voice-active',!!capture||speaking);
  el.classList.toggle('talked',mode==='replay'&&!capture&&!speaking);
  const name=dailyScenes[activeStory].npcs.find(n=>n.id===id).name;
  el.setAttribute('aria-label',name+' · '+(capture?'说完了':mode==='replay'?'重听':'交谈'));
 });
}
function storyReplay(id,slow=false){if(!activeStory||storyStep!==1)return;const st=mstate(activeStory);if(sceneNear(activeStory,st)?.id!==id)return;const r=st.lastNpc===id&&st.response?st.response:st.replies[id];if(!r)return;storyMotion++;cancelVoice();sceneContext=r;render();sceneSay(id,r.en,slow);}
function storyTalk(id,slow=false,ask=false){
 if(!activeStory||storyStep!==1)return;
 const st=mstate(activeStory);if(sceneNear(activeStory,st)?.id!==id)return;
 if(recording&&voiceDisplay?.target==='scene-npc'&&voiceDisplay.npcId===id){mic('scene-npc');return;}
 const mode=sceneContactMode(activeStory,st,id);
 if(!ask&&mode==='replay'){storyReplay(id,slow);return;}
 storyMotion++;cancelVoice();
 if(!st.started){const r=sceneInteract(activeStory,st,id);st.response=r;st.lastNpc=id;sceneContext=st.replies[id]||null;saveScenes();render();sceneSay(id,r.en);return;}
 mic('scene-npc');
}
function storyNpcSubmit(text){if(!activeStory||storyStep!==1||!text.trim())return;const id=activeStory,st=mstate(id),n=sceneNear(id,st);if(!n)return;const before=st.complete;const r=sceneInteract(id,st,n.id,text);if(!r)return;stopSpeech();st.lastUtterance=text;st.response=r;st.lastNpc=n.id;sceneContext=r;saveScenes();render();sceneSay(n.id,r.en);if(!before&&st.complete)storyCelebrate();}
function storyCoachSubmit(text='next'){if(!activeStory)return;sceneCoachLine=sceneCoach(activeStory,mstate(activeStory),text,sceneContext);render();speak(sceneCoachLine.en);}
function storiesHub(){return `<section class="card stories"><p class="muted">先准备语言背包，再进入地图。你来走动、提问、完成委托，Nova 陪你分析。</p><div class="story-list">${storyList.map(item=>{const w=dailyScenes[item.id],done=w?mstate(item.id).complete:s.complete;return `<button class="story-card ${item.id==='pip'?'main-story':''}" data-action="story-select" data-value="${item.id}"><span class="story-topic">${esc(item.topic)}</span><span class="story-name">${esc(w?.title||'寻找 Pip')}</span><span class="story-hook">${esc(w?.hook||'科技节的机器人不见了，听线索寻找它。')}</span><span class="story-go">${done?'已完成 · 再看看':'开始 ▶'}</span></button>`;}).join('')}</div></section>`;}
function storyDetail(){const d=stories[activeStory],w=dailyScenes[activeStory],st=mstate(activeStory);let body='';
 if(storyStep===0)body=`<div class="story-prep"><b>▧ 语言背包</b><p class="muted">先听关键词和常用表达。具体任务进入地图后由同伴告诉你。</p>${voiceSettings()}<div class="vocabgrid">${sceneVocabulary[activeStory].map(([word,zh])=>`<button class="word" data-speak="${esc(word)}"><em>🔊</em><b>${esc(word)}</b><span>${esc(zh)}</span></button>`).join('')}</div><div class="phrases">${w.phrases.map(p=>`<button class="phrase" data-speak="${esc(p)}">🔊 ${esc(p)}</button>`).join('')}</div><div class="actions">${btn(st.prepared?'返回探索 →':'准备好了，出发 →','scene-begin','primary')}${!voiceConfirmed&&!voiceTested&&!textOnly?btn('暂用文字体验','scene-text','chip'):''}</div></div>`;

 else body=`<div class="story-review"><div class="eyebrow">MISSION COMPLETE</div><div class="hero-icon">🏆</div><h2>你完成了${esc(w.title)}！</h2><p>你亲自听取委托、交流信息，并完成了行动。</p><p>🎧 ${st.journal.length} 条信息 · 🎙 ${st.tries} 次交流</p>${transcript(w.actions.at(-1).reply.en,w.actions.at(-1).reply.zh)}<div class="actions">${btn('🎉 重播庆祝','story-finish','primary')}${btn('回看信息','story-step','secondary','data-value="2"')}${btn('重玩本场景','scene-restart','chip')}${btn('选择其他冒险','story-back','chip')}</div></div>`;
 return `<section class="card stories detail"><div class="story-top">${btn('← 场景列表','story-back','chip')}<span class="story-topic">${esc(d.topic)}</span></div><h2>${esc(w.title)}</h2>${body}</section>`;

function storyCelebrate(){if(!activeStory||!mstate(activeStory).complete||document.querySelector('#victory'))return;const w=dailyScenes[activeStory];storyMotion++;cancelVoice();const el=document.createElement('dialog');el.id='victory';el.className='victory';el.setAttribute('aria-labelledby','victory-title');el.innerHTML=`<div class="confetti" aria-hidden="true">${Array.from({length:36},(_,i)=>`<i style="--x:${i*37%100}%;--delay:${i%6*.12}s;--turn:540deg;--color:${['#f3c66a','#71c8b0','#f39898'][i%3]}"></i>`).join('')}</div><div class="victory-body"><div class="victory-banner">🏆 MISSION COMPLETE</div><div class="hero-icon">🌟</div><h2 id="victory-title">你完成了${esc(w.title)}！</h2><p>你亲自完成了所有交流和委托。</p><div class="actions"><button id="scene-victory-back" class="primary" autofocus>继续探索</button><button id="scene-victory-review" class="secondary">冒险回顾</button></div></div>`;document.body.append(el);el.addEventListener('close',()=>{el.remove();},{once:true});el.querySelector('#scene-victory-back').onclick=()=>el.close();el.querySelector('#scene-victory-review').onclick=()=>{el.close();storyNavigate(3);};el.showModal();}

 const d=document.createElement('dialog');d.innerHTML='<h2>开启语音交谈</h2><p>'+ (localASR?'本地 Whisper small 英语识别：连续静音 2 秒后提交整句，也可以点“说完了”。录音仅在本机处理，临时音频在识别结束后清除；说完后显示文字。':'说话时持续识别，连续静音 2 秒后才回答，也可以点“说完了”。浏览器可能使用其远程语音服务。本应用不保存录音。')+'</p><div class="actions"><button class="secondary" id="no-mic">改用文字</button><button class="primary" id="yes-mic">开启麦克风</button></div>';document.body.append(d);d.showModal();d.querySelector('#no-mic').onclick=()=>{d.remove();openTyping(target);};d.querySelector('#yes-mic').onclick=()=>{d.remove();start();};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.speak){speak(b.dataset.speak);return;}if(b.dataset.action)action(b.dataset.action,b.dataset.value);});document.addEventListener('submit',e=>{if(e.target.id==='npc-talk'){e.preventDefault();npcSubmit(new FormData(e.target).get('question')||'');return;}if(e.target.id==='scene-npc-talk'){e.preventDefault();storyNpcSubmit(new FormData(e.target).get('question')||'');return;}if(e.target.id==='scene-coach-talk'){e.preventDefault();storyCoachSubmit(new FormData(e.target).get('utterance')||'');return;}if(e.target.id!=='talk')return;e.preventDefault();submit(new FormData(e.target).get('utterance')||'');});render();

document.addEventListener('change',e=>{if(e.target.matches('[data-rate-choice]')){const rate=Number(e.target.value);if(!speechRates.includes(rate))return;stopSpeech();speechRate=rate;voiceTested=false;voiceStatus='语速已设为 '+speechRate.toFixed(2)+'×，下次播放生效';try{localStorage.setItem('campus-speech-rate',String(speechRate));}catch{notice='浏览器未允许保存语速，本次设置仅在当前页面有效。';}render();return;}if(e.target.id==='voice-choice'){stopSpeech();voiceTested=false;preferredVoice=e.target.value;voiceStatus='音色已更改，点击试听确认';try{localStorage.setItem('campus-voice',preferredVoice);voiceSaveError=false;}catch{voiceSaveError=true;}render();}});
window.speechSynthesis?.addEventListener('voiceschanged',()=>{const select=document.querySelector('#voice-choice');if(select)select.innerHTML=voiceOptions();updateVoiceStatus();});

document.addEventListener('click',e=>{const world=e.target.closest('#world');if(!world||view!=='map')return;const npc=e.target.closest('[data-npc]');if(npc){const id=npc.dataset.npc;if(id==='pip'&&s.discovered&&!s.complete){winPip();return;}if(s.prepared&&nearest(player,s)?.id===id){destination=null;keys.clear();const n=nearest(player,s);if(npcAudio(n)){if(recording){cancelVoice();}replayNpc(n);}else mic('npc');}else if(!recording){targetNpc(id);}return;}if(recording)return;const rect=world.getBoundingClientRect();destination=bound({x:(e.clientX-rect.left)/rect.width*1000,y:(e.clientY-rect.top)/rect.height*600});world.focus({preventScroll:true});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sceneCoachOpen){action('scene-coach-close');return;}const d=document.querySelector('dialog[open]');if(d)d.close();else document.querySelectorAll('.transcript[open],.typing-fallback[open]').forEach(el=>el.open=false);return;}if(view!=='map'||document.querySelector('dialog')||e.target.closest('input,textarea,select,[contenteditable=true]'))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){if(recording)return;e.preventDefault();if(!e.repeat){const d={arrowup:[0,-8],w:[0,-8],arrowdown:[0,8],s:[0,8],arrowleft:[-8,0],a:[-8,0],arrowright:[8,0],d:[8,0]}[k];player=bound({x:player.x+d[0],y:player.y+d[1]});destination=null;}keys.add(k);}if(k==='e'&&!e.repeat&&s.prepared){const n=nearest(player,s);if(n?.id==='pip'&&s.discovered&&!s.complete){e.preventDefault();winPip();}else if(n){e.preventDefault();mic('npc');}}if(k==='r'&&!e.repeat){e.preventDefault();if(lastSpoken)speak(lastSpoken);}});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();destination=null;});
document.addEventListener('click',e=>{const world=e.target.closest('#story-world');if(!world)return;const npc=e.target.closest('[data-snpc]');if(npc){const id=npc.dataset.snpc;const w=dailyScenes[activeStory];const near=mnear(w,mstate(activeStory));if(near&&near.id===id){storyTalk(id);}else{const n=w.npcs.find(x=>x.id===id);animateStoryMove({x:n.x-40,y:n.y+40});}return;}if(activeStory){const rect=world.getBoundingClientRect();animateStoryMove({x:(e.clientX-rect.left)/rect.width*1000,y:(e.clientY-rect.top)/rect.height*600});world.focus({preventScroll:true});}});
document.addEventListener('keydown',e=>{if(!(inStory()&&storyStep===1)||document.querySelector('dialog[open]')||e.target.closest('.scene-coach'))return;if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;const k=e.key.toLowerCase();const map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k]){e.preventDefault();smove(map[k]);return;}if(k==='e'&&!e.repeat){const n=mnear(dailyScenes[activeStory],mstate(activeStory));if(n){e.preventDefault();if(recording)mic('scene-npc');else storyTalk(n.id,false,true);}return;}if(k==='r'&&!e.repeat){e.preventDefault();if(lastSpoken)speak(lastSpoken);}});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys.clear();destination=null;if(recording)cancelVoice(true);}});requestAnimationFrame(frame);

document.addEventListener('focusin',e=>{if(e.target.closest('input,textarea,select')){keys.clear();destination=null;}});

</script></body></html>
